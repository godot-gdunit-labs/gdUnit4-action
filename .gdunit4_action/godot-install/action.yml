name: install-godot-binary
description: 'Installs the Godot Runtime'

inputs:
  godot-version:
    description: 'The Godot engine version'
    type: string
    required: true
  godot-status-version:
    description: 'The Godot engine status version'
    type: string
    required: true
  godot-net:
    required: false
    type: boolean
    default: false
  install-path:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: 'Download and Install Godot ${{ inputs.godot-version }}-${{ inputs.godot-status-version }}'
      if: steps.godot-cache-binary.outputs.cache-hit != 'true'
      continue-on-error: false
      shell: bash
      env:
        ACTION_GODOT_VERSION: ${{ inputs.godot-version }}
        ACTION_GODOT_STATUS_VERSION: ${{ inputs.godot-status-version }}
        ACTION_GODOT_NET: ${{ inputs.godot-net == 'true' }}
        ACTION_IS_LINUX: ${{ runner.OS == 'Linux' }}
        ACTION_INSTALL_PATH: ${{ inputs.install-path }}
      run: |
        mkdir -p "${ACTION_INSTALL_PATH}"
        chmod 770 "${ACTION_INSTALL_PATH}"
        DIR="$HOME/.config/godot"
        if [ ! -d "$DIR" ]; then
          mkdir -p "$DIR"
          chmod 770 "$DIR"
        fi

        DOWNLOAD_URL=https://github.com/godotengine/godot-builds/releases/download/${ACTION_GODOT_VERSION}-${ACTION_GODOT_STATUS_VERSION}
        GODOT_BIN=Godot_v${ACTION_GODOT_VERSION}-${ACTION_GODOT_STATUS_VERSION}_linux.x86_64
        if [[ "${ACTION_GODOT_NET}" == 'true' ]]; then
          GODOT_BIN=Godot_v${ACTION_GODOT_VERSION}-${ACTION_GODOT_STATUS_VERSION}_mono_linux_x86_64
        fi

        GODOT_PACKAGE=$GODOT_BIN.zip
        echo "Download URL: $DOWNLOAD_URL/$GODOT_PACKAGE"
        wget --progress=bar:force:noscroll $DOWNLOAD_URL/$GODOT_PACKAGE -P "${ACTION_INSTALL_PATH}"
        unzip "${ACTION_INSTALL_PATH}"/$GODOT_PACKAGE -d "${ACTION_INSTALL_PATH}"
        rm -rf "${ACTION_INSTALL_PATH}"/$GODOT_PACKAGE

        if [[ "${ACTION_IS_LINUX}" == 'true' ]]; then
          echo "Run linux part"

          if [[ "${ACTION_GODOT_NET}" == 'true' ]]; then
            mv "${ACTION_INSTALL_PATH}"/$GODOT_BIN/* "${ACTION_INSTALL_PATH}"
            rmdir "${ACTION_INSTALL_PATH}"/$GODOT_BIN/
          fi

          mv "${ACTION_INSTALL_PATH}"/Godot_v* "${ACTION_INSTALL_PATH}"/godot
          chmod u+x "${ACTION_INSTALL_PATH}"/godot
          echo "${ACTION_INSTALL_PATH}/godot"
        else
          echo "Run windows part"
          pwd
          mv "${ACTION_INSTALL_PATH}"/$GODOT_BIN "${ACTION_INSTALL_PATH}"/godot.exe
          chmod u+x "${ACTION_INSTALL_PATH}"/godot.exe
          "${ACTION_INSTALL_PATH}"/godot.exe --version
          echo "${ACTION_INSTALL_PATH}/godot.exe"
        fi
